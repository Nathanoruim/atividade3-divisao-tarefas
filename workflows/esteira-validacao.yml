
name: Esteira de Validacao

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validar-html:
    name: Validar HTML
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar HTML com HTMLHint
        run: npx --yes htmlhint "**/*.html"

  validar-css:
    name: Validar CSS
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar sintaxe CSS
        run: npx --yes prettier "**/*.css" --parser css > /dev/null

  preparar-entrega:
    name: Preparar entrega
    runs-on: ubuntu-latest
    needs:
      - validar-html
      - validar-css

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Criar pasta dist
        run: mkdir -p dist

      - name: Confirmar entrega
        run: echo "Pasta dist criada com sucesso!"
